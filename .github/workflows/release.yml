name: Build desktop apps

# Builds the packaged desktop app for Windows (.exe / NSIS) and macOS (.dmg) on
# their own OS runners — a Windows installer can't be cross-built from macOS.
# Trigger by pushing a v* tag (also publishes a GitHub Release with the
# artifacts attached) or run it manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: "dist/*.exe"
          - os: macos-latest
            artifact: "dist/*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund

      - name: Build app
        run: npm run app:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: corelight-bundle-builder-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
